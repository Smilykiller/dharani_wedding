<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sunrise Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="40%" stop-color="#ffedd5"/>
      <stop offset="75%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Golden Sun & Rays -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Pillar & Roof Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="templeRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Sacred Fire Flame -->
    <linearGradient id="holyFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="75%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#881337" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="800" height="500" fill="url(#skyGrad)" rx="32"/>

  <!-- Golden Sunrise Rays -->
  <g opacity="0.35">
    <path d="M 400,220 L 100,0 L 150,0 Z" fill="#fde047"/>
    <path d="M 400,220 L 250,0 L 320,0 Z" fill="#fde047"/>
    <path d="M 400,220 L 480,0 L 550,0 Z" fill="#fde047"/>
    <path d="M 400,220 L 650,0 L 700,0 Z" fill="#fde047"/>
    <circle cx="400" cy="220" r="240" fill="url(#sunGlow)"/>
  </g>

  <!-- Sacred Gopuram (Temple Tower Silhouette in Background) -->
  <g transform="translate(400, 160)" filter="url(#shadow)" opacity="0.95">
    <!-- Base tier -->
    <polygon points="-120,60 120,60 100,20 -100,20" fill="url(#templeRoof)"/>
    <rect x="-110" y="60" width="220" height="12" fill="url(#goldGrad)"/>
    <!-- Tier 2 -->
    <polygon points="-95,20 95,20 80,-20 -80,-20" fill="url(#templeRoof)"/>
    <rect x="-90" y="20" width="180" height="8" fill="url(#goldGrad)"/>
    <!-- Tier 3 -->
    <polygon points="-75,-20 75,-20 62,-55 -62,-55" fill="url(#templeRoof)"/>
    <rect x="-70" y="-20" width="140" height="6" fill="url(#goldGrad)"/>
    <!-- Tier 4 -->
    <polygon points="-58,-55 58,-55 45,-85 -45,-85" fill="url(#templeRoof)"/>
    <rect x="-55" y="-55" width="110" height="6" fill="url(#goldGrad)"/>
    <!-- Top Kalasam Dome -->
    <path d="M -45,-85 Q 0,-115 45,-85 Z" fill="url(#goldGrad)"/>
    <!-- Golden Kalasams (Sacred spires at top) -->
    <circle cx="0" cy="-118" r="8" fill="url(#goldGrad)" filter="url(#softGlow)"/>
    <polygon points="-4,-118 4,-118 0,-135" fill="url(#goldGrad)"/>
    <circle cx="-25" cy="-105" r="6" fill="url(#goldGrad)"/>
    <polygon points="-28,-105 -22,-105 -25,-120" fill="url(#goldGrad)"/>
    <circle cx="25" cy="-105" r="6" fill="url(#goldGrad)"/>
    <polygon points="22,-105 28,-105 25,-120" fill="url(#goldGrad)"/>
  </g>

  <!-- Grand Mandapam Stage Pillars (Foreground) -->
  <g filter="url(#shadow)">
    <!-- Left Pillars -->
    <rect x="70" y="100" width="36" height="340" fill="url(#goldGrad)" rx="4"/>
    <rect x="60" y="90" width="56" height="20" fill="url(#goldGrad)" rx="3"/>
    <rect x="60" y="420" width="56" height="30" fill="url(#goldGrad)" rx="3"/>

    <rect x="170" y="140" width="28" height="300" fill="url(#goldGrad)" opacity="0.8" rx="4"/>
    <rect x="162" y="130" width="44" height="16" fill="url(#goldGrad)" rx="2"/>

    <!-- Right Pillars -->
    <rect x="694" y="100" width="36" height="340" fill="url(#goldGrad)" rx="4"/>
    <rect x="684" y="90" width="56" height="20" fill="url(#goldGrad)" rx="3"/>
    <rect x="684" y="420" width="56" height="30" fill="url(#goldGrad)" rx="3"/>

    <rect x="602" y="140" width="28" height="300" fill="url(#goldGrad)" opacity="0.8" rx="4"/>
    <rect x="594" y="130" width="44" height="16" fill="url(#goldGrad)" rx="2"/>

    <!-- Top Mandapam Arch & Garland Drapes -->
    <path d="M 60,110 Q 400,165 740,110 L 740,80 Q 400,135 60,80 Z" fill="#881337"/>
    <path d="M 60,105 Q 400,158 740,105" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Hanging Floral Curtains (Jasmine & Rose strings) -->
    <g opacity="0.9">
      <path d="M 120,115 Q 200,165 280,122" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
      <path d="M 280,122 Q 400,175 520,122" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
      <path d="M 520,122 Q 600,165 680,115" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Hanging Tassels -->
      <line x1="200" y1="140" x2="200" y2="230" stroke="#ffffff" stroke-width="4" stroke-dasharray="8,6"/>
      <circle cx="200" cy="235" r="8" fill="#f472b6"/>
      <line x1="400" y1="150" x2="400" y2="260" stroke="#ffffff" stroke-width="4" stroke-dasharray="8,6"/>
      <circle cx="400" cy="268" r="10" fill="#facc15" filter="url(#softGlow)"/>
      <line x1="600" y1="140" x2="600" y2="230" stroke="#ffffff" stroke-width="4" stroke-dasharray="8,6"/>
      <circle cx="600" cy="235" r="8" fill="#f472b6"/>
    </g>
  </g>

  <!-- Mandapam Altar Floor & Sacred Fire (Homam / Agni) -->
  <g transform="translate(400, 420)" filter="url(#shadow)">
    <!-- Stage Platform -->
    <polygon points="-280,30 280,30 220,-10 -220,-10" fill="#fff1f2" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Traditional Brass Kuthuvilakku (Standing Lamps) on Sides -->
    <g transform="translate(-160, -5)">
      <rect x="-4" y="-70" width="8" height="70" fill="url(#goldGrad)"/>
      <polygon points="-25,0 25,0 15,-12 -15,-12" fill="url(#goldGrad)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="6" fill="url(#goldGrad)"/>
      <!-- Lamp Flame -->
      <path d="M 0,-75 Q -8,-90 0,-105 Q 8,-90 0,-75" fill="url(#holyFire)" filter="url(#softGlow)"/>
    </g>
    <g transform="translate(160, -5)">
      <rect x="-4" y="-70" width="8" height="70" fill="url(#goldGrad)"/>
      <polygon points="-25,0 25,0 15,-12 -15,-12" fill="url(#goldGrad)"/>
      <ellipse cx="0" cy="-70" rx="18" ry="6" fill="url(#goldGrad)"/>
      <!-- Lamp Flame -->
      <path d="M 0,-75 Q -8,-90 0,-105 Q 8,-90 0,-75" fill="url(#holyFire)" filter="url(#softGlow)"/>
    </g>

    <!-- Homa Kundam (Sacred Fire Pit in Center) -->
    <polygon points="-55,10 55,10 40,-15 -40,-15" fill="#78350f" stroke="url(#goldGrad)" stroke-width="2"/>
    <polygon points="-45,-15 45,-15 35,-22 -35,-22" fill="#ea580c"/>
    
    <!-- Agni (Divine Fire) -->
    <path d="M 0,-18 Q -30,-50 -15,-85 Q -5,-65 0,-75 Q 10,-95 20,-65 Q 35,-45 0,-18" fill="url(#holyFire)" filter="url(#softGlow)"/>
    <path d="M 0,-20 Q -15,-45 -5,-65 Q 0,-50 5,-60 Q 15,-40 0,-20" fill="#fef08a"/>
  </g>

  <!-- Sacred Flower Offerings on Altar -->
  <circle cx="340" cy="425" r="14" fill="#ea580c"/>
  <circle cx="340" cy="425" r="8" fill="#facc15"/>
  <circle cx="460" cy="425" r="14" fill="#ea580c"/>
  <circle cx="460" cy="425" r="8" fill="#facc15"/>

  <!-- Elegant Location Ribbon at Bottom -->
  <g transform="translate(400, 465)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#ffffff" opacity="0.95" stroke="#f472b6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="#881337" text-anchor="middle" letter-spacing="2.5">
      SACRED TEMPLE SANCTUARY
    </text>
  </g>
</svg>
