<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Romantic Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="roseGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="80%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>

    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f472b6" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ethereal Backdrop -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="32"/>

  <!-- Decorative Bokeh & Light Orbs -->
  <circle cx="150" cy="120" r="80" fill="#fbcfe8" opacity="0.3" filter="url(#glow)"/>
  <circle cx="680" cy="380" r="100" fill="#e9d5ff" opacity="0.35" filter="url(#glow)"/>
  <circle cx="400" cy="250" r="180" fill="url(#ringGlow)" filter="url(#glow)"/>
  <circle cx="650" cy="100" r="50" fill="#fecdd3" opacity="0.25"/>
  <circle cx="100" cy="380" r="60" fill="#fde68a" opacity="0.2"/>

  <!-- Traditional Festive Hanging Garlands (Thoranam & Jasmine Beads) -->
  <g opacity="0.85">
    <!-- Garland Arch Lines -->
    <path d="M 0,0 Q 200,80 400,15 Q 600,80 800,0" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="6,6"/>
    <path d="M 0,0 Q 130,110 260,10 Q 400,120 540,10 Q 670,110 800,0" fill="none" stroke="#eab308" stroke-width="2"/>
    
    <!-- Marigold & Jasmine Bead Strings -->
    <!-- Left loop flowers -->
    <circle cx="60" cy="38" r="10" fill="#facc15"/><circle cx="60" cy="38" r="5" fill="#ea580c"/>
    <circle cx="130" cy="55" r="12" fill="#ffffff" filter="url(#softShadow)"/><circle cx="130" cy="55" r="5" fill="#fde047"/>
    <circle cx="200" cy="38" r="10" fill="#facc15"/><circle cx="200" cy="38" r="5" fill="#ea580c"/>
    <!-- Center loop flowers -->
    <circle cx="330" cy="52" r="11" fill="#facc15"/><circle cx="330" cy="52" r="5" fill="#ea580c"/>
    <circle cx="400" cy="65" r="14" fill="#ffffff" filter="url(#softShadow)"/><circle cx="400" cy="65" r="6" fill="#f472b6"/>
    <circle cx="470" cy="52" r="11" fill="#facc15"/><circle cx="470" cy="52" r="5" fill="#ea580c"/>
    <!-- Right loop flowers -->
    <circle cx="600" cy="38" r="10" fill="#facc15"/><circle cx="600" cy="38" r="5" fill="#ea580c"/>
    <circle cx="670" cy="55" r="12" fill="#ffffff" filter="url(#softShadow)"/><circle cx="670" cy="55" r="5" fill="#fde047"/>
    <circle cx="740" cy="38" r="10" fill="#facc15"/><circle cx="740" cy="38" r="5" fill="#ea580c"/>

    <!-- Vertical Hanging Jasmine Tassels -->
    <g transform="translate(130, 55)">
      <circle cx="0" cy="20" r="5" fill="#fff"/><circle cx="0" cy="35" r="5" fill="#fff"/><circle cx="0" cy="50" r="6" fill="#facc15"/>
    </g>
    <g transform="translate(400, 65)">
      <circle cx="0" cy="22" r="6" fill="#fff"/><circle cx="0" cy="40" r="6" fill="#fff"/><circle cx="0" cy="58" r="6" fill="#fff"/><circle cx="0" cy="76" r="8" fill="#f472b6"/>
    </g>
    <g transform="translate(670, 55)">
      <circle cx="0" cy="20" r="5" fill="#fff"/><circle cx="0" cy="35" r="5" fill="#fff"/><circle cx="0" cy="50" r="6" fill="#facc15"/>
    </g>
  </g>

  <!-- Sacred Engagement Rings Centerpiece -->
  <g transform="translate(400, 245)" filter="url(#softShadow)">
    <!-- Groom's Golden Ring -->
    <g transform="translate(-55, 10) rotate(-15)">
      <circle cx="0" cy="0" r="65" fill="none" stroke="url(#goldRing)" stroke-width="18"/>
      <circle cx="0" cy="0" r="65" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Bride's Rose Gold Ring with Solitaire Diamond -->
    <g transform="translate(55, -15) rotate(15)">
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#roseGoldRing)" stroke-width="14"/>
      <circle cx="0" cy="0" r="58" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
      
      <!-- Diamond Setting & Solitaire -->
      <polygon points="-22,-58 22,-58 14,-46 -14,-46" fill="url(#goldRing)"/>
      <polygon points="0,-95 -28,-68 -16,-58 16,-58 28,-68" fill="url(#diamondGrad)" filter="url(#glow)"/>
      <polygon points="0,-95 -16,-58 0,-58" fill="#bae6fd" opacity="0.7"/>
      <polygon points="0,-95 0,-58 16,-58" fill="#7dd3fc" opacity="0.8"/>
      <polygon points="-28,-68 0,-58 -16,-58" fill="#e0f2fe"/>
      <polygon points="28,-68 0,-58 16,-58" fill="#38bdf8"/>
      
      <!-- Sparkle Rays from Diamond -->
      <path d="M 0,-115 L 0,-125 M -25,-105 L -35,-115 M 25,-105 L 35,-115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Sparkle Stars -->
  <g fill="#fde047" filter="url(#glow)">
    <path d="M 230,150 L 235,165 L 250,170 L 235,175 L 230,190 L 225,175 L 210,170 L 225,165 Z" transform="scale(0.8) translate(80, 20)"/>
    <path d="M 570,160 L 574,172 L 586,176 L 574,180 L 570,192 L 566,180 L 554,176 L 566,172 Z" transform="scale(0.9) translate(-40, 50)"/>
    <path d="M 380,100 L 383,108 L 391,111 L 383,114 L 380,122 L 377,114 L 369,111 L 377,108 Z"/>
    <circle cx="280" cy="300" r="4" fill="#f472b6"/>
    <circle cx="530" cy="280" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Traditional Festive Diyas (Sacred Lamps) at Bottom -->
  <g transform="translate(200, 430)">
    <ellipse cx="0" cy="15" rx="35" ry="12" fill="url(#goldRing)" filter="url(#softShadow)"/>
    <path d="M -35,15 Q 0,45 35,15 Q 25,10 -35,15" fill="#b45309"/>
    <!-- Flame -->
    <path d="M 0,10 Q -12,-15 0,-35 Q 12,-15 0,10" fill="url(#flameGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="5" r="5" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <g transform="translate(600, 430)">
    <ellipse cx="0" cy="15" rx="35" ry="12" fill="url(#goldRing)" filter="url(#softShadow)"/>
    <path d="M -35,15 Q 0,45 35,15 Q 25,10 -35,15" fill="#b45309"/>
    <!-- Flame -->
    <path d="M 0,10 Q -12,-15 0,-35 Q 12,-15 0,10" fill="url(#flameGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="5" r="5" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Elegant Script Ribbon Banner bottom center -->
  <g transform="translate(400, 445)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#ffffff" opacity="0.9" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="0" y="6" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#831843" text-anchor="middle" letter-spacing="3">
      AUSPICIOUS UNION
    </text>
  </g>
</svg>
